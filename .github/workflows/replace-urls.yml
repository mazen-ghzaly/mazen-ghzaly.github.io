name: Replace Old URLs with New URLs

on:
  push:
    branches: [ main ] # يعمل تلقائياً عند الدفع للفرع الرئيسي
  workflow_dispatch: # يسمح لك بتشغيله يدوياً من تبويب Actions

jobs:
  replace-urls:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ضروري للسماح للـ Action بتعديل الملفات ورفعها

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Replace Old URLs
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          # النص القديم الذي تريد البحث عنه
          # ضع هنا كل الروابط القديمة التي تظهر في مشروعك
          find: "https://mazen-ghzaly.github.io/home"
          # النص الجديد الذي سيحل مكانه
          replace: "https://mazen-ghzaly.github.io/"
          regex: false # تعطيل التعامل مع النص كـ Regular Expression

      - name: Push Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-replace old URLs with new base URL"
     file_pattern: ':(exclude).github/workflows/*'
